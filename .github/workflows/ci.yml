# .github/workflows/ci.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python -c "import duckdb; import streamlit; import plotly; print('All imports successful!')"
    
    - name: Run attribution pipeline
      run: |
        python attribution.py
    
    - name: Check database
      run: |
        python -c "import duckdb; db = duckdb.connect('attribution.db'); print(f'Records: {db.execute(\"SELECT COUNT(*) FROM attribution_comparison\").fetchone()[0]}')"
    
    - name: Test dashboard
      run: |
        streamlit run dashboard.py --server.headless true --server.enableCORS false &
        sleep 10
        curl http://localhost:8501 || echo "Dashboard running"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Streamlit Cloud
      run: |
        echo "Deployment would happen here"
        echo "Streamlit Cloud auto-deploys from GitHub"
        echo "Visit: https://share.streamlit.io"
